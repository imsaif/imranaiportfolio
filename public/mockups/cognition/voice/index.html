<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cognition — asking by voice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone" id="phone">
      <!-- App bar -->
      <header class="bar">
        <span class="menu" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="bar-title">Cognition</span>
      </header>

      <!-- Body -->
      <div class="canvas" id="canvas">
        <section class="welcome" id="welcome">
          <h1 class="greeting">Hello, Tosin.</h1>
          <p class="subgreeting">Ask anything about your programmes</p>

          <p class="try">Try one of these</p>
          <div class="chips">
            <span class="chip">What was lesson completion last week?</span>
            <span class="chip">Show pupil enrollment by region?</span>
            <span class="chip">How is staff attendance trending this term?</span>
          </div>
        </section>

        <section class="thread" id="thread" hidden></section>
      </div>

      <!-- Composer -->
      <div class="composer-wrap">
        <div class="composer" id="composer">
          <!-- The waveform only exists while it is listening. -->
          <span class="wave" id="wave" aria-hidden="true"></span>
          <span class="composer-text" id="composerText">Ask about your education data…</span>
        </div>

        <div class="composer-row">
          <div class="modes">
            <span class="mode is-active">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1.5L3.5 9H7l-.5 5.5L12 7H8.5L9 1.5z" /></svg>
              Lite
            </span>
            <span class="mode">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2 5.5V3.5A1.5 1.5 0 0 1 3.5 2h2M14 5.5V3.5A1.5 1.5 0 0 0 12.5 2h-2M2 10.5v2A1.5 1.5 0 0 0 3.5 14h2M14 10.5v2a1.5 1.5 0 0 1-1.5 1.5h-2" />
              </svg>
              Pro
            </span>
          </div>

          <div class="composer-actions">
            <button class="mic" id="mic" type="button" tabindex="-1" aria-label="Voice input">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <rect x="6" y="2" width="4" height="7.5" rx="2" />
                <path d="M3.75 8a4.25 4.25 0 0 0 8.5 0" />
                <line x1="8" y1="12.25" x2="8" y2="14" />
              </svg>
            </button>
            <button class="send" id="send" type="button" tabindex="-1" aria-label="Send">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <polyline points="4.5,8 8,4.5 11.5,8" />
                <line x1="8" y1="4.5" x2="8" y2="12" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <span class="pointer" id="pointer" aria-hidden="true"></span>
      <button class="replay" id="replay" type="button" hidden>Replay</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
