<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cognition: the send button waits</title>
    <!--
      One state change, close in: while it is listening the send button is
      disabled, and it only becomes available once there is text to check.

      Small enough to keep in a single file rather than the three the other two
      prototypes use. No framework, no build step, no network.
    -->
    <style>
      :root {
        --primary: #1f3b90;
        --accent: #00b7bd;
        --text-primary: #101828;
        --text-tertiary: #98a2b3;
        --surface: #ffffff;
        --surface-sunken: #f5f5f5;
        --border-strong: #d6dae1;
        --border: #e7eaee;
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.6em;
        padding: 0 1.4em;
        background: var(--surface);
        color: var(--text-primary);
        font-family: var(--font);
        /* Scales with the frame it is embedded in. */
        font-size: clamp(9px, 1.35vw, 16px);
        -webkit-font-smoothing: antialiased;
      }

      .composer {
        display: flex;
        align-items: center;
        gap: 0.8em;
        padding: 0.55em 0.6em 0.55em 1.1em;
        border: 1px solid var(--border-strong);
        border-radius: 0.6em;
        transition: border-color 250ms ease;
      }

      .composer.is-ready {
        border-color: var(--accent);
      }

      .field {
        display: flex;
        align-items: center;
        gap: 0.7em;
        flex: 1;
        min-width: 0;
      }

      /* --- waveform, only while listening --- */

      .wave {
        display: none;
        align-items: center;
        gap: 0.11em;
        height: 1.3em;
        flex: none;
      }

      .composer.is-listening .wave {
        display: flex;
      }

      .wave i {
        width: 0.15em;
        min-height: 0.16em;
        border-radius: 999px;
        background: var(--accent);
        transform-origin: center;
        animation: pulse 900ms ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scaleY(0.3);
        }
        50% {
          transform: scaleY(1);
        }
      }

      .text {
        font-size: 0.95em;
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .text.is-filled {
        color: var(--text-primary);
      }

      /* --- controls --- */

      .actions {
        display: flex;
        align-items: center;
        gap: 0.7em;
        flex: none;
      }

      .send {
        display: grid;
        place-items: center;
        width: 2.1em;
        height: 2.1em;
        border-radius: 50%;
        color: #fff;
        background: var(--border-strong);
        transition:
          background-color 300ms ease,
          transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Only once there is something worth sending. */
      .send.is-ready {
        background: var(--primary);
        transform: scale(1.06);
      }

      .mic {
        display: grid;
        place-items: center;
        width: 1.9em;
        height: 1.9em;
        color: var(--text-primary);
      }

      .send svg,
      .mic svg {
        width: 1.05em;
        height: 1.05em;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .modes {
        display: flex;
        gap: 0.15em;
        padding: 0.18em;
        background: var(--surface-sunken);
        border-radius: 999px;
      }

      .mode {
        display: flex;
        align-items: center;
        gap: 0.32em;
        padding: 0.35em 0.8em;
        font-size: 0.85em;
        color: var(--text-primary);
        border-radius: 999px;
        white-space: nowrap;
      }

      .mode.is-active {
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.12);
      }

      .mode svg {
        width: 0.85em;
        height: 0.85em;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .mode.is-active svg {
        fill: currentColor;
        stroke: none;
      }

      .disclaimer {
        margin: 0;
        font-size: 0.78em;
        text-align: center;
        color: var(--text-tertiary);
      }

      /* The state change is the whole point, so a still frame has to show the
         end state rather than the start. */
      @media (prefers-reduced-motion: reduce) {
        .wave i {
          animation: none;
          transform: scaleY(0.7);
        }
        .composer,
        .send {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="composer" id="composer">
      <div class="field">
        <span class="wave" id="wave" aria-hidden="true"></span>
        <span class="text" id="text">Listening&hellip;</span>
      </div>

      <div class="actions">
        <span class="send" id="send" aria-hidden="true">
          <svg viewBox="0 0 16 16"><polyline points="4.5,8 8,4.5 11.5,8" /><line x1="8" y1="4.5" x2="8" y2="12" /></svg>
        </span>
        <span class="mic" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <rect x="6" y="2" width="4" height="7.5" rx="2" />
            <path d="M3.75 8a4.25 4.25 0 0 0 8.5 0" />
            <line x1="8" y1="12.25" x2="8" y2="14" />
          </svg>
        </span>
        <div class="modes">
          <span class="mode is-active">
            <svg viewBox="0 0 16 16"><path d="M9 1.5L3.5 9H7l-.5 5.5L12 7H8.5L9 1.5z" /></svg>
            Lite
          </span>
          <span class="mode">
            <svg viewBox="0 0 16 16">
              <path d="M2 5.5V3.5A1.5 1.5 0 0 1 3.5 2h2M14 5.5V3.5A1.5 1.5 0 0 0 12.5 2h-2M2 10.5v2A1.5 1.5 0 0 0 3.5 14h2M14 10.5v2a1.5 1.5 0 0 1-1.5 1.5h-2" />
            </svg>
            Pro
          </span>
        </div>
      </div>
    </div>

    <p class="disclaimer">Cognition is an AI and can make mistakes. Please double check important information.</p>

    <script>
      (function () {
        'use strict';

        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var QUESTION = 'Show me lesson completion in Bayelsa for the last 4 weeks.';

        var composer = document.getElementById('composer');
        var text = document.getElementById('text');
        var send = document.getElementById('send');
        var wave = document.getElementById('wave');

        // Randomised bar heights and timings, so it does not read as a loop.
        for (var i = 0; i < 26; i++) {
          var bar = document.createElement('i');
          bar.style.height = (30 + Math.random() * 70).toFixed(0) + '%';
          bar.style.animationDelay = (Math.random() * 0.9).toFixed(2) + 's';
          bar.style.animationDuration = (0.7 + Math.random() * 0.5).toFixed(2) + 's';
          wave.appendChild(bar);
        }

        function wait(ms) {
          return new Promise(function (r) {
            setTimeout(r, ms);
          });
        }

        function listening() {
          composer.classList.add('is-listening');
          composer.classList.remove('is-ready');
          send.classList.remove('is-ready');
          text.classList.remove('is-filled');
          text.textContent = 'Listening…';
        }

        function transcribe() {
          text.textContent = '';
          text.classList.add('is-filled');
          var words = QUESTION.match(/\S+\s*/g) || [];
          return words.reduce(function (chain, w) {
            return chain.then(function () {
              text.textContent += w;
              return wait(70 + Math.random() * 70);
            });
          }, Promise.resolve());
        }

        async function loop() {
          // Reduced motion gets the state that carries the meaning: text present,
          // send available. No cycling.
          if (reduce) {
            composer.classList.remove('is-listening');
            composer.classList.add('is-ready');
            send.classList.add('is-ready');
            text.classList.add('is-filled');
            text.textContent = QUESTION;
            return;
          }

          for (;;) {
            listening();
            await wait(1800);
            await transcribe();
            await wait(400);
            // Listening stops, and only now is there anything worth sending.
            composer.classList.remove('is-listening');
            composer.classList.add('is-ready');
            send.classList.add('is-ready');
            await wait(2600);
          }
        }

        // Only once it is on screen.
        if ('IntersectionObserver' in window) {
          var io = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (e) {
                if (e.isIntersecting) {
                  loop();
                  io.disconnect();
                }
              });
            },
            { threshold: 0.4 }
          );
          io.observe(composer);
        } else {
          loop();
        }
      })();
    </script>
  </body>
</html>
